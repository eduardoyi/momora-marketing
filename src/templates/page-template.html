<!DOCTYPE html>
<html lang="en">
<head>
{{HEAD}}
    <style>
        /* Content page specific styles */
        .content-page {
            padding: var(--spacing-xl) 0;
            background: white;
            min-height: 70vh;
        }
        
        .content-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }
        
        .content-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-dark);
        }
        
        .content-body h1 {
            font-size: 2.5rem;
            margin-bottom: var(--spacing-md);
            font-family: var(--font-display);
            color: var(--text-dark);
        }
        
        .content-body h2 {
            font-size: 2rem;
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            color: var(--text-dark);
        }
        
        .content-body h3 {
            font-size: 1.5rem;
            margin-top: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            color: var(--text-dark);
        }
        
        .content-body p {
            margin-bottom: var(--spacing-md);
            color: var(--text-gray);
        }
        
        .content-body ul,
        .content-body ol {
            margin-bottom: var(--spacing-md);
            padding-left: var(--spacing-md);
        }
        
        .content-body li {
            margin-bottom: var(--spacing-xs);
            color: var(--text-gray);
        }
        
        .content-body a {
            color: var(--primary);
            text-decoration: underline;
            transition: color 0.3s ease;
        }
        
        .content-body a:hover {
            color: var(--primary-dark);
        }
        
        .content-body blockquote {
            border-left: 4px solid var(--primary);
            padding-left: var(--spacing-md);
            margin: var(--spacing-md) 0;
            font-style: italic;
            color: var(--text-gray);
        }
        
        .content-body code {
            background: var(--bg-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .content-body pre {
            background: var(--bg-light);
            padding: var(--spacing-md);
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin-bottom: var(--spacing-md);
        }
        
        .content-body pre code {
            background: none;
            padding: 0;
        }
        
        .content-body hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: var(--spacing-lg) 0;
        }
        
        .content-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: var(--spacing-md);
        }
        
        .content-body table th,
        .content-body table td {
            border: 1px solid #e5e7eb;
            padding: var(--spacing-sm);
            text-align: left;
        }
        
        .content-body table th {
            background: var(--bg-light);
            font-weight: 600;
        }
        
        .content-body img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-sm);
            margin: var(--spacing-md) 0;
        }
        
        .last-updated {
            color: var(--text-light);
            font-size: 0.875rem;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
{{GTM_BODY}}
{{HEADER}}

    <!-- Content Section -->
    <section class="content-page">
        <div class="content-container">
            <article class="content-body">
                {{CONTENT}}
            </article>
        </div>
    </section>

    <!-- Final CTA -->
    <section id="cta" class="cta">
        <div class="container">
            <div class="cta-content">
                <h2 class="cta-title">Start preserving your family's story today</h2>
                <p class="cta-subtitle">
                    Save the little things with text, voice, photos, videos, and optional AI illustrations.
                </p>
                <div class="download-buttons download-buttons-large">
                    <a href="https://apps.apple.com/us/app/usemomora/id6745403572" target="_blank" rel="noopener noreferrer" class="store-badge"><img src="/assets/images/brand/badge-app-store.svg" alt="Download on the App Store" width="150" height="50"></a>
                    <a href="https://play.google.com/store/apps/details?id=com.memora.app" target="_blank" rel="noopener noreferrer" class="store-badge"><img src="/assets/images/brand/badge-google-play.png" alt="Get it on Google Play" width="168" height="50"></a>
                </div>
                <p class="small-text">Momora Plus is available through the App Store and Google Play</p>
            </div>
        </div>
    </section>

{{FOOTER}}

    <script src="/js/script.js"></script>
    <script src="/js/store-link-escape.js"></script>
</body>
</html>
